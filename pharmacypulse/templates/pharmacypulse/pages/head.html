{% extends "pharmacypulse/layouts/app.html" %}
{% load pharmacypulse %}
{% block title %}PharmacyPulse{% endblock %}
{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
// Detect Capacitor native app — add .native-app class to body
if(window.Capacitor || navigator.userAgent.indexOf('CapacitorApp') !== -1 || window.matchMedia('(display-mode: standalone)').matches){
  document.documentElement.classList.add('native-app');
  document.addEventListener('DOMContentLoaded',function(){ document.body.classList.add('native-app'); });
}
{% if google_places_key %}
// Load Google Maps JS API only on pages that render a map.
if(['/map','/list','/admin-analytics'].indexOf(window.location.pathname) !== -1
   && !document.querySelector('script[src*="maps.googleapis.com/maps/api/js"]')){
  var s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key={{ google_places_key }}&libraries=places&loading=async&callback=Function.prototype';
  s.async=true;document.head.appendChild(s);
}
{% endif %}
</script>
{% endblock %}
