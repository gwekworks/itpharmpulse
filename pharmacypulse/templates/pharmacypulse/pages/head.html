{% extends "pharmacypulse/layouts/app.html" %}
{% load pharmacypulse %}
{% block title %}PharmacyPulse{% endblock %}
{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
// Detect Capacitor native app — add .native-app class to body
if(window.Capacitor || navigator.userAgent.indexOf('CapacitorApp') !== -1 || window.matchMedia('(display-mode: standalone)').matches){
  document.documentElement.classList.add('native-app');
  document.addEventListener('DOMContentLoaded',function(){ document.body.classList.add('native-app'); });
}
{% if google_places_key %}
// Load Google Maps JS API only on pages that render a map.
if(['/map','/list','/admin-analytics'].indexOf(window.location.pathname) !== -1
   && !document.querySelector('script[src*="maps.googleapis.com/maps/api/js"]')){
  var s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key={{ google_places_key }}&libraries=places&loading=async&callback=Function.prototype';
  s.async=true;document.head.appendChild(s);
}
{% endif %}
</script>
<style>
#cookie-banner { display:none; position:fixed; bottom:0; left:0; right:0; z-index:400; background:#0f172a; color:rgba(255,255,255,0.8); padding:0.875rem 1.25rem; font-size:0.75rem; }
#cookie-banner a { color:#60a5fa; text-decoration:none; }
#cookie-banner button { background:#008F82; color:white; border:none; padding:0.375rem 1rem; font-size:0.75rem; font-weight:600; cursor:pointer; margin-left:0.75rem; }
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  if(!localStorage.getItem('pp_cookie_consent')){
    var b=document.createElement('div');b.id='cookie-banner';
    b.innerHTML='We use essential cookies to provide our service. We do not use tracking or advertising cookies. <a href="/privacy">Privacy Policy</a><button onclick="localStorage.setItem(\'pp_cookie_consent\',\'1\');this.parentElement.remove()">Got it</button>';
    b.style.display='flex';b.style.alignItems='center';b.style.justifyContent='center';b.style.flexWrap='wrap';b.style.gap='0.5rem';
    document.body.appendChild(b);
  }
});
</script>
{% endblock %}
