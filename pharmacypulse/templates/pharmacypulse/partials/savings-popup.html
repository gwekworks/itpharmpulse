<script>
(function() {
  var popup = document.getElementById('pp-savings-popup');
  if (!popup) return;
  setTimeout(function() {
    popup.classList.add('pp-savings-open');
  }, 3000);
  window.ppCloseSavings = function() {
    popup.classList.remove('pp-savings-open');
  };
})();
</script>
