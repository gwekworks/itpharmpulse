{% load pharmacypulse %}
<div class="admin-sidebar">

  <!-- Logo -->
  <div class="admin-sidebar-logo">
    <a href="/admin-dashboard">
      <div class="admin-sidebar-logo-mark">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
      </div>
      <div>
        <div class="admin-sidebar-logo-name">PharmacyPulse</div>
        <div class="admin-sidebar-logo-sub">Admin Portal</div>
      </div>
    </a>
  </div>

  <!-- Nav -->
  <nav>
    <div class="admin-sidebar-section admin-sidebar-section-top">Overview</div>
    <a href="/admin-dashboard" id="admin-nav-dashboard"><span class="pp-emoji">📊</span> Dashboard</a>
    <a href="/admin-analytics" id="admin-nav-analytics"><span class="pp-emoji">📈</span> Analytics</a>

    <div class="admin-sidebar-section">Content</div>
    <a href="/admin-moderation" id="admin-nav-moderation"><span class="pp-emoji">🛡️</span> Moderation</a>
    <a href="/admin-claims" id="admin-nav-claims"><span class="pp-emoji">📋</span> Claims</a>
    <a href="/admin-pharmacy-facts" id="admin-nav-facts"><span class="pp-emoji">💡</span> Facts</a>

    <div class="admin-sidebar-section">Data</div>
    <a href="/admin-users" id="admin-nav-users"><span class="pp-emoji">👥</span> Users</a>
    <a href="/admin-pharmacies" id="admin-nav-pharmacies"><span class="pp-emoji">🏪</span> Pharmacies</a>
    <a href="/admin-pharmacies#chains" id="admin-nav-chains"><span class="pp-emoji">🏢</span> Chains</a>
    <a href="/admin-shortages" id="admin-nav-shortages"><span class="pp-emoji">⚠️</span> Shortages</a>
    <!-- Logout -->
    <form method="POST" action="/logout" style="margin-top: 0.5rem">
      {% csrf_token %}
      <button type="submit" style="width: 100%; padding: 0.75rem; background: white; border: 1px solid #e5e7eb; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; color: #64748b; cursor: pointer">Log out</button>
    </form>
  </nav>

  <!-- Footer -->
  <div class="admin-sidebar-footer">
    <a href="/home">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 5-7 7 7 7"/></svg>
      Back to App
    </a>
  </div>
</div>

<script>
(function(){
  var path = window.location.pathname;
  document.querySelectorAll('.admin-sidebar a[id^="admin-nav"]').forEach(function(a){
    if(path === a.getAttribute('href')) a.classList.add('active');
  });
})();
</script>
